[project]
name = "somax"
version = "0.0.13"
description = "Simple Ocean Models in JAX."
authors = [
    {name = "Juan Emmanuel Johnson", email = "jemanjohnson34@gmail.com"},
    {name = "Takaya Uchida", email = "roxyboy.guppy@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
keywords = ["ocean", "jax", "shallow water", "quasigeostrophic"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.10.0",
    "jaxtyping>=0.3.9",
    "equinox>=0.13.6",
    "diffrax>=0.7.2",
    "lineax>=0.1.1",
    "optimistix>=0.1",
    "einops>=0.8.2",
    "finitevolx @ git+https://github.com/jejjohnson/finitevolX.git@v0.0.41",
    "spectraldiffx>=0.0.10",
    "pipekit",
    "pipekit-cycle",
    # Pure-function basis zoo. Supplies the spatial dictionaries (Gabor / radial
    # frames, box-Laplacian & graph-Laplacian eigenbases, wavelet, EOF, and
    # divergence-free vector bases) and temporal features that the reduced-order
    # forcing (``somax._src.core.forcing_bank``) evaluates on a ``Domain``. Only
    # the public ``geonnax.basis`` surface is used. Pinned to the merged commit
    # of the public-basis-surface + new-bases work (geonnax#25).
    "geonnax @ git+https://github.com/jejjohnson/geonnax.git@9f160d3",
]

[project.urls]
Repository = "https://github.com/jejjohnson/somax"

[project.scripts]
somax-sim = "somax._src.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.6.0",
]
lint = [
    "ruff>=0.15.15",
]
typecheck = [
    "ty==0.0.49",
]
da = [
    # Data-assimilation integration (Phase 4). Pre-alpha and git-pinned (no
    # releases yet). filterax (4a) drives ensemble filters; vardax (4b) drives
    # variational 4DVar. Both pull gaussx transitively (see the gaussx override
    # under [tool.uv]). Required by ``somax.da``; install with
    # ``uv sync --group da``.
    "filterax @ git+https://github.com/jejjohnson/filterax@28c1070",
    "vardax @ git+https://github.com/jejjohnson/vardax@a00b1ae",
]
sim = [
    "hydra-core>=1.3.2",
    "hydra-zen>=0.16.0",
    "omegaconf>=2.3",
    "orbax-checkpoint>=0.11.37",
    "cyclopts>=3.0",
    "zarr>=3.1.6",
    "xarray>=2026.4.0",
    "pyyaml>=6.0.3",
    "dvc>=3.67.1",
    "loguru>=0.7.3",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-jupyter>=0.26.3",
    "jupytext>=1.19.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["somax"]

[tool.uv]
# filterax pins gaussx@a66bab1 (direct URL in its metadata) while vardax
# requires a bare ``gaussx``; force a single git ref across the whole graph.
override-dependencies = ["gaussx @ git+https://github.com/jejjohnson/gaussx@a66bab1"]

[tool.uv.sources]
# Pinned to v0.0.10 to match finitevolx v0.0.41's own spectraldiffx pin —
# uv requires a single git ref per package across the dependency graph,
# so this must agree with finitevolx (a 0.0.12 pin conflicts and fails to
# resolve).
spectraldiffx = { git = "https://github.com/jejjohnson/spectraldiffx.git", tag = "v0.0.10" }
# pipekit is a uv workspace; consume its subpackages from git subdirectories.
# Both come from the same repo, so a single ref keeps them in lockstep.
pipekit = { git = "https://github.com/jejjohnson/pipekit.git", subdirectory = "packages/pipekit" }
pipekit-cycle = { git = "https://github.com/jejjohnson/pipekit.git", subdirectory = "packages/pipekit-cycle" }

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["notebooks/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741", "F722"]

[tool.ruff.lint.per-file-ignores]
"content/tutorials/step*.py" = ["E501", "I001", "B018"]
"content/tutorials/step*.ipynb" = ["E501", "I001", "B018"]
# Double-gyre gallery pages: prose markdown cells run long, imports follow the
# intro cell, and figure titles/comments use Unicode math typography (ψ, ζ, ν,
# √, ², ½, ×) — same authoring convention as the step/phase tutorials.
"content/tutorials/doublegyre_*.py" = ["E501", "I001", "B018", "RUF001", "RUF002", "RUF003"]
"content/tutorials/doublegyre_*.ipynb" = ["E501", "I001", "B018", "RUF001", "RUF002", "RUF003"]
# Phase 0 "Foundations" theory chapters: prose paragraphs are single long
# lines (the jupytext authoring rule, so MyST-NB renders them without spurious
# soft breaks), and imports are interleaved after the intro markdown cells.
"content/tutorials/arakawa_cgrid.py" = ["E501", "I001", "RUF003"]
"content/tutorials/arakawa_cgrid.ipynb" = ["E501", "I001", "RUF003"]
"content/tutorials/operators.py" = ["E501", "I001", "RUF003"]
"content/tutorials/operators.ipynb" = ["E501", "I001", "RUF003"]
"content/tutorials/boundary_conditions.py" = ["E501", "I001", "RUF003"]
"content/tutorials/boundary_conditions.ipynb" = ["E501", "I001", "RUF003"]
# Phase 1-4 "Theory & Practice" chapters: same authoring conventions as the
# Phase 0 chapters above (single-line prose, interleaved imports, Unicode math
# typography such as en-dashes and the × sign).
"content/tutorials/phase*.py" = ["E501", "I001", "RUF003"]
"content/tutorials/phase*.ipynb" = ["E501", "I001", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
call-non-callable = "ignore"  # eqx.Module subclasses with __call__
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
not-iterable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"  # optional deps (orbax) + git-based deps

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=somax --cov-report=term-missing --cov-report=xml:coverage.xml"
filterwarnings = ["error", "ignore::DeprecationWarning"]
xfail_strict = true
markers = [
    # Full-pipeline tests that exercise the somax-sim runner end to end
    # (CLI orchestration, crash-recovery checkpointing, spinup/restart
    # chains). Auto-applied to tests/test_cli_*.py by tests/conftest.py.
    "integration: end-to-end pipeline tests (slower, not pure unit tests)",
    # Heavy tests dominated by JIT-compiled differentiation or long
    # integrations (e.g. ``test_grad_through_*``). Excluded from the PR
    # CI job via ``-m 'not slow'``; run in the manual full-suite
    # workflow. Auto-applied by tests/conftest.py; all ``integration``
    # tests are also marked ``slow``.
    "slow: heavy correctness/integration tests excluded from PR CI",
]

[tool.coverage.run]
source = ["somax"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
